name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (all/shared-types/api-client/eslint-config)"
        required: true
        default: "all"

env:
  NODE_VERSION: 22

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: Determine packages to publish
        id: packages
        run: |
          SCOPE="@atlas-shop"
          if [ "${{ github.event.inputs.package }}" = "all" ] || [ "${{ github.event_name }}" = "release" ]; then
            echo "names=$SCOPE/shared-types $SCOPE/api-client $SCOPE/eslint-config" >> $GITHUB_OUTPUT
          else
            echo "names=$SCOPE/${{ github.event.inputs.package }}" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        run: npm run build -w packages/shared-types -w packages/api-client 2>/dev/null || true

      - name: Publish packages
        run: |
          for name in ${{ steps.packages.outputs.names }}; do
            echo " Publishing $name..."
            npm publish -w "$name" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
