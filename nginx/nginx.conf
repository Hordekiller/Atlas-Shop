# =============================================================================
# HTTP Server (port 80)
# =============================================================================
server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== ACME Challenge (Let's Encrypt certbot verification) =====
    # Uncomment the following block when using certbot:
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # ===== HTTP → HTTPS Redirect =====
    # Uncomment the block below to redirect all HTTP traffic to HTTPS.
    # Requires the HTTPS server block above to be active.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Stricter rate limit for auth endpoints
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stricter rate limit for OTP endpoints
    location ~ ^/api/v1/otp/ {
        limit_req zone=auth burst=5 nodelay;
        limit_conn conn_limit 5;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API - NestJS
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn_limit 30;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger docs
    location /api/docs {
        proxy_pass http://api:8000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Admin panel
    location /admin/ {
        limit_req zone=admin burst=20 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://admin:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Web storefront
    location / {
        limit_req zone=storefront burst=100 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://web:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
