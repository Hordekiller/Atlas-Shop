name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
  JWT_SECRET: "test-jwt-secret-for-ci"
  ENCRYPTION_KEY: "test-encryption-key-that-is-32-chars!!"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
  NEXT_PUBLIC_MEDIA_URL: "http://localhost:8000"
  NEXT_PUBLIC_SITE_NAME: "فروشگاه"
  NEXT_PUBLIC_SITE_SHORT_NAME: "فروشگاه"
  NEXT_PUBLIC_SITE_DESCRIPTION: "CI test build"

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm test -w @atlas-shop/api

  e2e-test:
    name: API E2E Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run test:e2e -w @atlas-shop/api
